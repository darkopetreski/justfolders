[package]
name = "justfolders"
version = "0.1.0"
edition = "2024"
description = "JustFolders is a backup tool for creating folder snapshots without duplicating unchanged files."

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
configparser = "3.1.0"
dirs = "6.0.0"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
thiserror = "2.0.18"

# `bundled` causes us to automatically compile and link in an up to date
# version of SQLite for you. This avoids many common build issues, and
# avoids depending on the version of SQLite on the users system (or your
# system), which may be old or missing. It's the right choice for most
# programs that control their own SQLite databases.
#
# That said, it's not ideal for all scenarios and in particular, generic
# libraries built around `rusqlite` should probably not enable it, which
# is why it is not a default feature -- it could become hard to disable.
rusqlite = { version = "0.39.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# Link-time optimization: optimize and drop unused code across all crates (smaller binary; slower release builds).
lto = true
# One codegen unit per crate: better per-crate optimization; complements LTO (slower compile, slightly smaller/faster binary).
codegen-units = 1
