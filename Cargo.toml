[package]
name = "justfolders"
version = "0.1.0"
edition = "2024"
description = "JustFolders is a backup tool for creating folder snapshots without duplicating unchanged files."

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
configparser = "3.1.0"
dirs = "6.0.0"
thiserror = "2.0.18"

[dev-dependencies]
serial_test = "3.4.0"
tempfile = "3.27.0"
