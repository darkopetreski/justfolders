[package]
name = "justfolders"
version = "0.1.0"
edition = "2024"
description = "JustFolders is a backup tool for creating folder snapshots without duplicating unchanged files."

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
configparser = "3.1.0"
dirs = "6.0.0"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
sha2 = "0.10"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# Link-time optimization: optimize and drop unused code across all crates (smaller binary; slower release builds).
lto = true
# One codegen unit per crate: better per-crate optimization; complements LTO (slower compile, slightly smaller/faster binary).
codegen-units = 1
